# Start:  cd webconsole && docker compose up --build      ->  http://localhost:3000
# Mit Git-Stand im Über-Dialog (Klick aufs HAW-Logo):
#   GIT_COMMIT=$(git rev-parse HEAD) GIT_DATE=$(git log -1 --format=%cI) docker compose up --build
services:
  webconsole:
    build:
      context: ..
      dockerfile: webconsole/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        GIT_DATE: ${GIT_DATE:-}
    image: renode4mc-webconsole:latest
    init: true
    ports:
      - "3000:3000"   # Web-Oberfläche + Upload
      - "3333:3333"   # UART-WebSocket
      - "3334:3334"   # Control-WebSocket
    # Zustandslos: die hochgeladene Firmware liegt nur im RAM-Dateisystem des Containers.
    # "exec" ist Pflicht: Renode entpackt seine CPU-Bibliothek (tlib) nach /tmp und lädt sie
    # von dort. Docker hängt tmpfs sonst mit noexec ein -> "failed to map segment from shared object".
    tmpfs:
      - /tmp:exec,mode=1777
    restart: unless-stopped
