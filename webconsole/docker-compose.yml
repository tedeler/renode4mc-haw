# Start:  cd webconsole && docker compose up --build      ->  http://localhost:3000
# With the Git version in the About dialog (click on the HAW logo):
#   GIT_COMMIT=$(git rev-parse HEAD) GIT_DATE=$(git log -1 --format=%cI) docker compose up --build
services:
  webconsole:
    build:
      context: ..
      dockerfile: webconsole/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
        GIT_BRANCH: ${GIT_BRANCH:-}
        GIT_DATE: ${GIT_DATE:-}
    image: renode4mc-webconsole:latest
    init: true
    ports:
      - "3000:3000"   # web interface + upload
      - "3333:3333"   # UART WebSocket
      - "3334:3334"   # control WebSocket
    # Stateless: the uploaded firmware is only stored in the RAM file system of the container.
    # "exec" is required: Renode unpacks its CPU library (tlib) to /tmp and loads it
    # from there. Otherwise Docker mounts tmpfs with noexec -> "failed to map segment from shared object".
    tmpfs:
      - /tmp:exec,mode=1777
    restart: unless-stopped
