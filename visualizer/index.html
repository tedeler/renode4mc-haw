<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Renode LED Visualizer</title>
    <style>
        body {
            background-color: #1e1e1e;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 50px;
        }
        .panel {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #status {
            margin-bottom: 20px;
            font-size: 14px;
            color: #ff9800;
        }
        svg {
            transition: all 0.1s;
        }
    </style>
</head>
<body>
    <div class="panel">
        <div id="status">Verbinde mit Renode (ws://127.0.0.1:9000)...</div>

        <!-- SVG LED -->
        <svg width="120" height="120" viewBox="0 0 100 100">
            <!-- Außenring -->
            <circle cx="50" cy="50" r="45" fill="#222" stroke="#111" stroke-width="3" />
            <!-- Leuchtkörper (wird durch JS manipuliert) -->
            <circle id="led_0" cx="50" cy="50" r="35" fill="#333" />
            <!-- Lichtreflexion für 3D-Effekt -->
            <ellipse cx="38" cy="30" rx="15" ry="8" fill="rgba(255,255,255,0.15)" transform="rotate(-30 38 30)" />
        </svg>

        <p>GPIO Port N - Pin 0</p>
    </div>

    <script>
        const ledEl = document.getElementById('led_0');
        const statusEl = document.getElementById('status');

        function connect() {
            const ws = new WebSocket('ws://127.0.0.1:9000');

            ws.onopen = () => {
                statusEl.textContent = 'Verbunden mit Renode';
                statusEl.style.color = '#4caf50';
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);

                    // Reagiert auf das Format der WebSocketBridge.cs
                    if (data.type === 'gpio' && data.pin === 0) {
                        const isHigh = data.state === true;

                        ledEl.style.fill = isHigh ? '#00ff00' : '#333';
                        ledEl.style.filter = isHigh ? 'drop-shadow(0 0 15px #00ff00)' : 'none';
                    }
                } catch (e) {
                    console.error("Fehler beim Parsen der WebSocket-Nachricht:", e);
                }
            };

            ws.onclose = () => {
                statusEl.textContent = 'Verbindung getrennt. Neuer Versuch in 1s...';
                statusEl.style.color = '#ff9800';

                // LED bei Verbindungsabbruch ausschalten
                ledEl.style.fill = '#333';
                ledEl.style.filter = 'none';

                setTimeout(connect, 1000);
            };

            ws.onerror = () => {
                ws.close();
            };
        }

        // Auto-Connect starten
        connect();
    </script>
</body>
</html>
